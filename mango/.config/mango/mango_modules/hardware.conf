# Keyboard
repeat_rate=25
repeat_delay=250
numlock_on=0
xkb_rules_layout=us

# Trackpad
trackpad_natural_scrolling=1
mousebind=SUPER,btn_left,moveresize,curmove

# Gestures
gesturebind=none,right,3,viewtoleft
gesturebind=none,left,3,viewtoright
gesturebind=SUPER,right,3,focusdir,left
gesturebind=SUPER,left,3,focusdir,right
gesturebind=none,up,3,toggleoverview

gesturebind=none,right,4,focusdir,left
gesturebind=none,left,4,focusdir,right
